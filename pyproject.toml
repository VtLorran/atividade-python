[project]
name = "atividade-python"
version = "0.1.0"
description = "Projeto FastAPI"
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = [
    "fastapi[standard] (>=0.115.0)",
]

[dependency-groups]
dev = [
    "pytest (>=8.0.0)",
    "pytest-cov (>=5.0.0)",
    "ruff (>=0.6.0)",
    "typos (>=1.20.0)",
    "httpx (>=0.27.0)",
    "poethepoet (>=0.29.0)",
]

[tool.poetry]
package-mode = false

[tool.ruff]
line-length = 79
extend-exclude = ['migrations']

[tool.ruff.lint]
preview = true
select = ['I', 'F', 'E', 'W', 'PL', 'PT']

[tool.ruff.format]
preview = true
quote-style = 'single'

[tool.pytest]
pythonpath = ['.']
addopts = ['-p', 'no:warnings', '--cov=atividade_python', '--cov-context=test']

[tool.poe.tasks]
lint = "ruff check"
format.sequence = [
  { cmd = "ruff check --fix" },
  { cmd = "ruff format" },
]
serve = "fastapi dev atividade_python/app.py"
test.sequence = [
  "lint",
  { cmd = "pytest -s -x -vv $POE_EXTRA_ARGS" },
  { cmd = "coverage html --show-contexts" },
]

[tool.poe]
poetry_command = ""

[tool.typos.files]
extend-exclude = ["*.md", "migrations"]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"